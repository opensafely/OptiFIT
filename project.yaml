version: '5.0'

actions:
  generate_dataset:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py --output output/dataset.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/dataset.csv.gz

  first_analysis:
    run: r:v2 analysis/first_analysis.R
    needs: [generate_dataset]
    outputs:
      moderately_sensitive:
        fitn: output/fitn.png
        fitp: output/fitp.png
        tbl_all: output/tbl1c.html

  comparator_analysis:
    run: r:v2 analysis/comparator_analysis.R
    needs: [generate_dataset]
    outputs:
      moderately_sensitive:
        tbl_comp: output/tbl_comp.html