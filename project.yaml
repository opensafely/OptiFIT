version: '5.0'

actions:
  generate_dataset:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py --output output/dataset.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/dataset.csv.gz

  first_analysis:
    run: r:v2 analysis/first_analysis.R
    needs: [generate_dataset]
    outputs:
      moderately_sensitive:
        fitn: output/fitn.png
        fitp: output/fitp.png
        tbl_all: output/tbl1c.html
        tbl_no_zero: output/tblc_no_zero.html
        tbl_zero: output/tbl_zero.html

  comparator_analysis:
    run: r:v2 analysis/comparator_analysis.R
    needs: [generate_dataset]
    outputs:
      moderately_sensitive:
        tbl_comp: output/tbl_comp_combined.html

  generate_dataset_value_null:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_value_null.py --output output/dataset_value_null.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/dataset_value_null.csv.gz

  analysis_value_null:
    run: r:v2 analysis/analysis_value_null.R
    needs: [generate_dataset_value_null]
    outputs:
      moderately_sensitive:
        tbl_comp: output/tbl_null.html